<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitebox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            color: lightgray;
        }

        nav .logo img {
            height: 50px;
            width: 50px;
            border-radius: 100%;
        }

        nav .menu ul {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px
        }

        nav .menu ul a {
            text-decoration: none;
            color: lightgray;
            font-size: 20px;
        }

        nav .logo:hover {
            cursor: pointer;
        }

        nav .menu ul a:hover {
            color: red;
        }

        body {
            height: 100vh;
            width: 100%
        }

        header {
            height: 10vh
        }

        main {
            height: 80vh;
            border: 2px solid lightgray;
        }

        footer {
            height: 10vh
        }

        .main_content {
            text-align: center;
        }

        .product_container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            width: 100%;
            height: 100%;
        }

        .card1 {
            border: 2px solid lightgray;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }

        .card1:hover {
            transform: translateY(8px);
        }

        .product_logo1 {
            height: 200px;
            width: 100%;
            align-items: center;
            justify-content: center;
            display: flex;
        }

        .product_logo1 img {
            height: 200px;
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product_detail1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: black;
            color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer:hover {
            color: red;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXZLLp0jfPKu_NFlp5z5zGnvfX7ebtEWgCm06VSXKE33eQtva9JFwwWow&s=10" />
                <h2>Bitebox</h2>
            </div>
            <div class="menu">
                <ul style="list-style-type: none">
                    <li><a>Home</a></li>
                    <li><a>About us</a></li>
                    <li><a>Contact us</a></li>
                    <li><a>Cart</a></li>
                    <li><a>Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="main_content">
            <br />
            <h2>Our Products</h2>
            <div class="product_container">
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_detail1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_detail1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_detail1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_detail1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer_content">
            <p>Footer Content Under Construction</p>
        </div>
    </footer>
</body>

</html>
