<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        nav .logo:hover {
            cursor: pointer;
        }

        nav .logo img {
            width: 50px;
            height: 50px;
            border-radius: 100%;
        }

        nav .menu ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            color: white;
        }

        nav .menu ul a {
            text-decoration: none;
            font-size: 20px;
        }

        nav .menu ul a:hover {
            color: red;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlEAIoinTroj6NXY2-5H8J8QeB-NbR_bCWDYC4Foxwmw&s=10"
                alt="Practice Image">

            <h2>Practice</h2>
        </div>

        <div class="menu">
            <ul style="list-style-type: none;">
                <li><a>Home</a></li>
                <li><a>About</a></li>
                <li><a>Contact Us</a></li>
                <li><a>Login</a></li>
            </ul>
        </div>

    </nav>

</body>
<main></main>
<footer></footer>

</html>
