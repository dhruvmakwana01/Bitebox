<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bitebox Ecommerce Portal</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ITVedant" />
    <meta name="keywords" content="data science, java, html" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
    
        <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="biteboxproduct.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav #logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            color: lightgray;
        }

        nav #logo:hover {
            cursor: pointer;
        }

        nav #logo img {
            width: 50px;
            height: 50px;
            border-radius: 100%;
        }

        nav #menu ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin: 0;
        }

        nav #menu ul a {
            text-decoration: none;
            color: lightgray;
            font-size: 20px;
        }

        nav #menu ul a:hover {
            color: red;
        }

        nav #menu li {
            color: lightgray;
            font-size: 20px;
        }

        nav #menu li:hover {
            color: red;
            cursor: pointer;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            height: auto;
        }

        main {
            flex: 1;
            border: 2px solid lightgray;
        }

        .main_content {
            text-align: center;
        }

        .product_container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card1 {
            border: 2px solid lightgray;
            overflow: hidden;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card1:hover {
            transform: translateY(8px);
        }

        .product_logo1 {
            height: 200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product_logo1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .product_details1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            min-height: 10vh;
            background-color: black;
            color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer a:hover {
            color: red;
        }
    </style>
</head>

<body>

    <header>

        <nav>

            <div id="logo">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXZLLp0jfPKu_NFlp5z5zGnvfX7ebtEWgCm06VSXKE33eQtva9JFwwWow&s=10"
                    alt="Bitebox Logo">

                <h2>Bitebox</h2>

            </div>


            <div id="menu">

                <ul style="list-style-type:none">

                    <li>
                        <a href="https://www.itvedant.com/">Home</a>
                    </li>

                    <li>
                        <a>Contact us</a>
                    </li>

                    <li>
                        <a>About us</a>
                    </li>

                    <li
                        data-bs-toggle="modal"
                        data-bs-target="#exampleModal"
                        id="cartModal"
                        class="nav-item position-relative">

                        Cart

                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                            id="qty">
                            0
                        </span>

                    </li>

                    <li>
                        <a>Login</a>
                    </li>

                </ul>

            </div>

        </nav>

    </header>


    <main>

        <div id="search" style="display: flex; justify-content: center; margin-top: 20px;">
             <input class="form-control me-2" id="searchInput" style="text-align: center;" type="search" placeholder="Search" aria-label="Search"/>
        </div>

        <div class="main_content">

            <br>

            <h2>Our Products</h2>

            <div
                class="product_container"
                id="product_container">
            </div>

        </div>


        <!-- Cart Modal -->

        <div
            class="modal fade"
            id="exampleModal"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <div class="modal-header">

                        <h1
                            class="modal-title fs-5"
                            id="exampleModalLabel">

                            Your Basket

                        </h1>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                        </button>

                    </div>


                    <div
                        class="modal-body"
                        id="billing">

                        Your cart is empty.

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Close

                        </button>

                        <button
                            type="button"
                            class="btn btn-primary">

                            Buy Now

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer>

        <div class="footer_content">

            <p>
                <a>Footer Content Under Construction</a>
            </p>

        </div>

    </footer>

</body>

</html>
