<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <title> Bitebox Ecommerce Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ITVedtant" />
    <meta name="keywords" content="data science, java, html" />
    <!--meta http-equiv="refresh" content= "10;https://www.itvedant.com/" /-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav #logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            color: white;
        }

        nav #logo:hover {
            cursor: pointer;
        }

        nav #logo img {
            width: 50px;
            height: 50px;
            border-radius: 100%;
        }


        nav #menu ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
            color: white;
        }

        nav #menu ul a {
            text-decoration: none;
            color: white;
            font-size: 20px;
        }

        nav #menu ul a:hover {
            color: red;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div id="logo">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXZLLp0jfPKu_NFlp5z5zGnvfX7ebtEWgCm06VSXKE33eQtva9JFwwWow&s=10" />
                <h2> Bitebox </h2>
            </div>
            <!--ul style="list-style-type:none; list-style-image:url('checkbitebox.jpeg')"-->
            <div id="menu">
                <ul style="list-style-type:none">
                    <li><a href="https://www.itvedant.com/">Home</a></li>
                    <li><a>Contact us</a></li>
                    <li><a>About us</a></li>
                    <li><a>Cart</a></li>
                    <li><a>Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main></main>
    <footer></footer>
</body>

</html>
