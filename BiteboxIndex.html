    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav #logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            color: lightgray;
        }

        nav #logo:hover {
            cursor: pointer;
        }

        nav #logo img {
            width: 50px;
            height: 50px;
            border-radius: 100%;
        }


        nav #menu ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        nav #menu ul a {
            text-decoration: none;
            color: lightgray;
            font-size: 20px;
        }

        nav #menu ul a:hover {
            color: red;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            height: auto;
        }

        main {
            flex: 1;
            border: 2px solid lightgray;
        }


        .main_content {
            text-align: center;
        }

        .product_container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card1 {
            border: 2px solid lightgray;
            overflow: hidden;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card1:hover {
            transform: translateY(8px);
        }


        .product_logo1 {
            height: 200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product_logo1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .product_details1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            min-height: 10vh;
            background-color: black;
            color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer a:hover {
            color: red;
        }
    </style>
