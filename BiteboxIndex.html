<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <title> Bitebox Ecommerce Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ITVedtant" />
    <meta name="keywords" content="data science, java, html" />
    <!--meta http-equiv="refresh" content= "10;https://www.itvedant.com/" /-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        nav #logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            color: lightgray;
        }

        nav #logo:hover {
            cursor: pointer;
        }

        nav #logo img {
            width: 50px;
            height: 50px;
            border-radius: 100%;
        }


        nav #menu ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        nav #menu ul a {
            text-decoration: none;
            color: lightgray;
            font-size: 20px;
        }

        nav #menu ul a:hover {
            color: red;
        }

        body {
            height: 100vh;
            width: 100%;
        }

        header {
            height: 10vh;
        }

        main {
            height: 80vh;
            border: 2px solid lightgray;
        }

        footer {
            height: 10vh;
        }

        .main_content {
            text-align: center;
        }

        .product_container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card1 {
            border: 2px solid lightgray;
            overflow: hidden;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s;
        }

        .card1:hover {
            transform: translateY(8px);
            scale(1.2);
        }


        .product_logo1 {
            height: 200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product_logo1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .product_details1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background-color: black;
            color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer:hover {
            color: red;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div id="logo">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXZLLp0jfPKu_NFlp5z5zGnvfX7ebtEWgCm06VSXKE33eQtva9JFwwWow&s=10" />
                <h2> Bitebox </h2>
            </div>
            <!--ul style="list-style-type:none; list-style-image:url('checkbitebox.jpeg')"-->
            <div id="menu">
                <ul style="list-style-type:none">
                    <li><a href="https://www.itvedant.com/">Home</a></li>
                    <li><a>Contact us</a></li>
                    <li><a>About us</a></li>
                    <li><a>Cart</a></li>
                    <li><a>Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="main_content">
            <br />
            <h2>Our Products</h2>
            <div class="product_container">
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_details1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_details1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_details1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
                <div class="card1">
                    <section class="product_logo1">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4iCgokFVdXFvB6Dvo_wbWongVA4UyXakcCyUH6p-zbg&s=10" />
                    </section>
                    <section class="product_details1">
                        <p>Juicy grilled chicken burger</p>
                        <p>₹199/-</p>
                        <button>Add</button>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer_content">
            <p>Footer Content Under Construction</p>
        </div>

    </footer>
</body>

</html>
